name: Deploy to Cloudflare

# Deploys the web app and the signaling Worker with Wrangler on every push to main.
# It does nothing until the repository secrets CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID are set (Settings -> Secrets and variables -> Actions).

on:
  push:
    branches: [main]
    paths: ["public/**", "src/**", "wrangler.toml", "package*.json", ".github/workflows/deploy.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_CREDENTIALS: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - name: Skip notice
        if: env.HAS_CREDENTIALS != 'true'
        run: echo "Cloudflare secrets are not configured; skipping deploy."
      - uses: actions/checkout@v4
        if: env.HAS_CREDENTIALS == 'true'
      - uses: actions/setup-node@v4
        if: env.HAS_CREDENTIALS == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: env.HAS_CREDENTIALS == 'true'
      - name: Deploy
        if: env.HAS_CREDENTIALS == 'true'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
