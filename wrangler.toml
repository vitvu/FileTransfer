# Production deployment: ONE Cloudflare Worker on https://file.vit.io.vn
#   - static web app (./public) is served by Cloudflare's asset hosting (free, never invokes the Worker)
#   - only /ws runs code: the WebRTC signaling server (Worker + Durable Object)
name = "filetransfer"
main = "src/worker.js"
compatibility_date = "2026-10-31"

# Serve the site on this hostname (the DNS record and TLS certificate are created automatically).
routes = [{ pattern = "file.vit.io.vn", custom_domain = true }]
workers_dev = false # no *.workers.dev URL, so no account subdomain is exposed
preview_urls = false

[assets]
directory = "./public"
run_worker_first = ["/ws"]

# Web origins allowed to open a signaling WebSocket (comma separated, scheme + host, no path).
[vars]
ALLOWED_ORIGINS = "https://file.vit.io.vn"

# Do not retain request logs for this Worker.
[observability]
enabled = false

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
